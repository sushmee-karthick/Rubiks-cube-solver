[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rubiks-solver"
version = "0.1.0"
description = "A Rubik's Cube solver in pure Python (Kociemba two-phase algorithm)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
rubik = "rubiks_solver.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["rubiks_solver"]
